[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "whatif-engine"
version = "0.1.0"
description = "A deterministic financial decision engine"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx", "fastapi>=0.115"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
ui = ["streamlit>=1.40", "pandas>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
